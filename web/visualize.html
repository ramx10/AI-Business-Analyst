<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Data Visualization — AI Business Analyst</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
    const savedTheme = localStorage.getItem('ai_ba_theme') || 'light-corporate';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    .viz-selector {
      display: flex; flex-direction: column; gap: 2px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px 12px 12px 12px;
      min-width: 220px;
    }
    .viz-selector-title {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-secondary);
      padding: 0 8px 8px 8px; margin-bottom: 4px;
    }
    .viz-option {
      display: block;
      padding: 10px 14px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; transition: all 0.15s ease; border: none;
      background: transparent; text-align: left; width: 100%;
    }
    .viz-option:hover { background: var(--bg-hover); color: var(--text-primary); }
    .viz-option.active {
      background: var(--accent-muted); color: var(--accent);
      font-weight: 600;
    }
    .viz-layout {
      display: flex; gap: 20px; align-items: stretch;
    }
    .chart-area {
      flex: 1; min-width: 0;
    }
    @media (max-width: 768px) {
      .viz-layout { flex-direction: column; }
      .viz-selector { flex-direction: row; overflow-x: auto; min-width: 0; }
      .viz-option { white-space: nowrap; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-crumb">
        <span>AI Business Analyst</span><span class="topbar-sep">/</span>
        <span class="current">Data Visualization</span>
      </div>
      <div class="topbar-actions" id="session-badge"></div>
    </header>
    <div class="page-content">
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div>
          <h1 class="page-title">Data Visualization</h1>
          <p class="page-subtitle">Step 4 of 7 — Create custom charts and plots.</p>
        </div>
      </div>

      <!-- Control Panel for Themes -->
      <div class="control-panel" style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;">
        <div style="display:flex;gap:20px;align-items:center;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-secondary);">Theme:</span>
            <select id="theme-select" class="input" style="width:160px;padding:5px 10px;font-size:12px;cursor:pointer;">
              <option value="dark">Sleek Dark</option>
              <option value="light-corporate">Light Corporate</option>
              <option value="pastel-soft">Pastel Soft</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:8px;">
          <a href="/dashboard.html" class="btn btn-primary btn-sm">Executive Dashboard →</a>
        </div>
      </div>

      <div id="viz-root"><div class="loading-state"><div class="spinner"></div><span>Loading visualizations…</span></div></div>

      <div style="margin-top:20px;display:flex;gap:8px;">
        <a href="/clean.html" class="btn btn-ghost btn-sm">← Back to Cleaning</a>
        <a href="/dashboard.html" class="btn btn-primary btn-sm">Continue to Dashboard →</a>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
<script>
initSidebar('visualize');

document.addEventListener('DOMContentLoaded', async () => {
  const root = document.getElementById('viz-root');
  const sid = Session.require(); if (!sid) return;

  const themeSelect = document.getElementById('theme-select');
  const savedTheme = localStorage.getItem('ai_ba_theme') || 'dark';
  if (themeSelect) themeSelect.value = savedTheme;

  let dashData = null;
  let activeViz = localStorage.getItem('ai_ba_active_viz') || 'bar';

  const vizTypes = [
    { id: 'bar',     label: 'Column & Bar Chart' },
    { id: 'line',    label: 'Time Series' },
    { id: 'heatmap', label: 'Heatmap' },
    { id: 'scatter', label: 'Scatter Plot' },
    { id: 'pie',     label: 'Pie Chart' },
    { id: 'bubble',  label: 'Bubble Chart' },
  ];

  function renderVizSelector() {
    return `
      <div class="viz-selector">
        <div class="viz-selector-title">Visualize</div>
        ${vizTypes.map(v => `
          <button class="viz-option ${activeViz === v.id ? 'active' : ''}" data-viz="${v.id}">${v.label}</button>
        `).join('')}
      </div>`;
  }

  function renderActiveChart(c) {
    let chartHtml = '';
    let chartTitle = '';
    let chartSubtitle = '';

    switch(activeViz) {
      case 'bar':
        chartTitle = 'Revenue by Region';
        chartSubtitle = 'Bar Chart';
        chartHtml = `<div style="height:400px"><canvas id="chart-viz-main"></canvas></div>`;
        break;
      case 'line':
        chartTitle = 'Revenue Trend';
        chartSubtitle = 'Time Series';
        chartHtml = `<div style="height:400px"><canvas id="chart-viz-main"></canvas></div>`;
        break;
      case 'heatmap':
        chartTitle = 'Revenue Heatmap';
        chartSubtitle = 'Region × Category';
        chartHtml = `<div style="height:400px"><canvas id="chart-viz-main"></canvas></div>`;
        break;
      case 'scatter':
        chartTitle = 'Revenue vs Profit';
        chartSubtitle = 'Scatter Plot';
        chartHtml = `<div style="height:400px"><canvas id="chart-viz-main"></canvas></div>`;
        break;
      case 'pie':
        chartTitle = 'Category Share';
        chartSubtitle = 'Pie Chart';
        chartHtml = `<div style="height:400px"><canvas id="chart-viz-main"></canvas></div>`;
        break;
      case 'bubble':
        chartTitle = 'Product Analysis';
        chartSubtitle = 'Revenue × Profit × Orders';
        chartHtml = `<div style="height:400px"><canvas id="chart-viz-main"></canvas></div>`;
        break;
    }

    return `
      <div class="card" style="margin: 0; flex: 1;">
        <div class="card-header">
          <div class="card-title">${chartTitle}</div>
          <div class="card-subtitle">${chartSubtitle}</div>
        </div>
        <div class="card-body" style="padding-top:0">
          ${chartHtml}
        </div>
      </div>`;
  }

  function drawActiveChart(c) {
    const id = 'chart-viz-main';
    switch(activeViz) {
      case 'bar':
        makeBarChart(id, c.regional.labels, c.regional.values);
        break;
      case 'line':
        makeLineChart(id, c.revenue_trend.labels, c.revenue_trend.values);
        break;
      case 'heatmap':
        if (c.heatmap && c.heatmap.x_labels.length > 0) {
          makeHeatmapChart(id, c.heatmap.x_labels, c.heatmap.y_labels, c.heatmap.matrix);
        }
        break;
      case 'scatter':
        makeScatterChart(id, c.scatter.revenue, c.scatter.profit, c.scatter.labels);
        break;
      case 'pie':
        makePieChart(id, c.pie.labels, c.pie.values);
        break;
      case 'bubble':
        if (c.bubble && c.bubble.length > 0) {
          makeBubbleChart(id, c.bubble);
        }
        break;
    }
  }

  function render() {
    if (!dashData) return;
    const c = dashData.charts;

    root.innerHTML = `
      <div class="viz-layout">
        ${renderVizSelector()}
        <div class="chart-area">
          ${renderActiveChart(c)}
        </div>
      </div>
    `;

    // Draw main viz chart
    drawActiveChart(c);

    // Attach viz selector click handlers
    document.querySelectorAll('.viz-option').forEach(btn => {
      btn.addEventListener('click', () => {
        activeViz = btn.dataset.viz;
        localStorage.setItem('ai_ba_active_viz', activeViz);
        render();
      });
    });
  }

  // Load data
  try {
    dashData = await API.get(`/api/dashboard?session_id=${sid}`);
    render();
  } catch (e) {
    root.innerHTML = `<div class="alert alert-danger">${e.message} — <a href="/upload.html" style="color:inherit">upload a dataset first</a></div>`;
    return;
  }

  // Theme Change Handler
  if (themeSelect) {
    themeSelect.addEventListener('change', (e) => {
      const theme = e.target.value;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('ai_ba_theme', theme);
      render();
    });
  }

  window.addEventListener('theme-changed', (e) => {
    if (themeSelect) themeSelect.value = e.detail.theme;
    render();
  });
});
</script>
</body>
</html>
