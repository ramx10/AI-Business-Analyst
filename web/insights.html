<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AI Insights — AI Business Analyst</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const savedTheme = localStorage.getItem('ai_ba_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-crumb">
        <span>AI Business Analyst</span><span class="topbar-sep">/</span>
        <span class="current">AI Insights</span>
      </div>
      <div class="topbar-actions" id="session-badge"></div>
    </header>
    <div class="page-content">
      <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <h1 class="page-title">Business Insights</h1>
          <p class="page-subtitle">Step 6 of 7 — AI-generated trends, risks, and recommendations via Llama 3.3.</p>
        </div>
        <button class="btn btn-primary" id="generate-btn">Generate Insights</button>
      </div>

      <div id="insights-root">
        <div class="card no-hover">
          <div class="card-body" style="padding:48px;text-align:center;color:var(--text-secondary);">
            <div style="font-size:28px;margin-bottom:12px;opacity:0.4">◉</div>
            <div style="font-size:13px">Click <strong style="color:var(--text-primary)">Generate Insights</strong> to run the AI analysis pipeline.</div>
          </div>
        </div>
      </div>

      <div style="margin-top:20px;display:flex;gap:8px;">
        <a href="/dashboard.html" class="btn btn-ghost btn-sm">← Back</a>
        <a href="/report.html" class="btn btn-secondary btn-sm">Continue to Report →</a>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
initSidebar('insights');
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('generate-btn');
  const root = document.getElementById('insights-root');
  const sid = Session.require(); if (!sid) return;

  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Analyzing…';
    root.innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Running Groq inference — this may take 15–30 seconds…</span></div>';
    try {
      const d = await API.get(`/api/insights?session_id=${sid}`);
      root.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div><div class="card-title">Analysis Results</div><div class="card-subtitle">Generated by Llama 3.3 via Groq</div></div>
            <span class="pill pill-green">Complete</span>
          </div>
          <div class="card-body prose">${marked.parse(d.insights)}</div>
        </div>`;
    } catch(e) {
      root.innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
    } finally { btn.disabled = false; btn.textContent = 'Regenerate'; }
  });
});
</script>
</body>
</html>
