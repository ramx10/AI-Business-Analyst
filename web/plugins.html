<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Plugins — AI Business Analyst</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    const savedTheme = localStorage.getItem('ai_ba_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const savedTemplate = localStorage.getItem('ai_ba_template') || '';
    if (savedTemplate === 'superieur-admin' || savedTemplate === 'study-admin' || savedTemplate === 'server-admin') {
      document.documentElement.classList.add('template-' + savedTemplate);
    }
  </script>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-crumb">
        <span>AI Business Analyst</span><span class="topbar-sep">/</span>
        <span class="current">Plugins</span>
      </div>
      <div class="topbar-actions" id="session-badge"></div>
    </header>
    <div class="page-content">
      <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <h1 class="page-title">Plugin Manager</h1>
          <p class="page-subtitle">Extend functionality with community and custom plugins.</p>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;">
        <div>
          <h3 style="font-size:14px;font-weight:700;margin:0 0 12px 0;">Installed Plugins</h3>
          <div id="plugins-grid" style="display:flex;flex-direction:column;gap:12px;">
            <div class="loading-state"><div class="spinner"></div><span>Loading plugins…</span></div>
          </div>
        </div>
        <div>
          <h3 style="font-size:14px;font-weight:700;margin:0 0 12px 0;">Run Plugin</h3>
          <div class="card" style="padding:20px;">
            <div style="margin-bottom:12px;">
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Select Plugin</label>
              <select id="run-plugin-select" class="input" style="width:100%;padding:7px 10px;font-size:12px;">
                <option value="">— Choose a plugin —</option>
              </select>
            </div>
            <div id="run-plugin-params" style="display:none;margin-bottom:12px;">
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Parameters (JSON)</label>
              <textarea id="run-plugin-params-input" class="input" style="width:100%;padding:5px 8px;font-size:11px;height:60px;resize:none;font-family:monospace;" placeholder='{"column": "text_col"}'></textarea>
            </div>
            <div style="display:flex;gap:8px;">
              <button id="btn-run-plugin" class="btn btn-primary btn-sm" disabled>Run</button>
              <button id="btn-uninstall-plugin" class="btn btn-danger btn-sm" disabled>Uninstall</button>
            </div>
            <div id="run-plugin-result" style="margin-top:12px;"></div>
          </div>

          <h3 style="font-size:14px;font-weight:700;margin:20px 0 12px 0;">Install Plugin</h3>
          <div class="card" style="padding:20px;">
            <p style="font-size:12px;color:var(--text-secondary);margin:0 0 12px 0;">Upload a <code>.py</code> file that subclasses <code>BasePlugin</code>.</p>
            <input id="install-file-input" type="file" accept=".py" style="font-size:12px;margin-bottom:12px;" />
            <button id="btn-install-plugin" class="btn btn-primary btn-sm" disabled>Install</button>
            <div id="install-plugin-result" style="margin-top:12px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/plugins.js"></script>
</body>
</html>
