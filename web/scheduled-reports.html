<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Scheduled Reports — AI Business Analyst</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    const savedTheme = localStorage.getItem('ai_ba_theme') || 'light-corporate';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const savedTemplate = localStorage.getItem('ai_ba_template') || '';
    if (savedTemplate === 'superieur-admin' || savedTemplate === 'study-admin' || savedTemplate === 'server-admin') {
      document.documentElement.classList.add('template-' + savedTemplate);
    }
  </script>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-crumb">
        <span>AI Business Analyst</span><span class="topbar-sep">/</span>
        <span class="current">Scheduled Reports & Alerts</span>
      </div>
      <div class="topbar-actions" id="session-badge"></div>
    </header>
    <div class="page-content">
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div>
          <h1 class="page-title">Scheduled Reports & Alerts</h1>
          <p class="page-subtitle">Automate report generation and get notified when business conditions change.</p>
        </div>
      </div>

      <div class="tabs" style="display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:8px;">
        <button class="tab-btn active" data-tab="schedules" onclick="switchTab('schedules')">Scheduled Reports</button>
        <button class="tab-btn" data-tab="alerts" onclick="switchTab('alerts')">Alert Rules</button>
      </div>

      <!-- Scheduled Reports Tab -->
      <div id="tab-schedules" class="tab-content">
        <div class="card" style="padding:20px;margin-bottom:24px;">
          <h4 style="font-size:14px;font-weight:700;color:var(--text-primary);margin:0 0 16px 0;">Create Schedule</h4>
          <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Name</label>
              <input type="text" id="sched-name" class="input" placeholder="Weekly Executive Report" style="width:180px;padding:8px 12px;font-size:13px;">
            </div>
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Frequency</label>
              <select id="sched-frequency" class="input" style="width:130px;padding:8px 12px;font-size:13px;">
                <option value="daily">Daily</option>
                <option value="weekly" selected>Weekly</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Email</label>
              <input type="email" id="sched-email" class="input" placeholder="user@example.com" style="width:200px;padding:8px 12px;font-size:13px;">
            </div>
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Format</label>
              <select id="sched-format" class="input" style="width:100px;padding:8px 12px;font-size:13px;">
                <option value="pdf">PDF</option>
                <option value="html">HTML</option>
                <option value="md">Markdown</option>
              </select>
            </div>
            <button class="btn btn-primary" onclick="createSchedule()" style="padding:8px 24px;">Create</button>
          </div>
          <div id="sched-result" style="margin-top:12px;"></div>
        </div>

        <div class="card" style="padding:20px;">
          <h4 style="font-size:14px;font-weight:700;color:var(--text-primary);margin:0 0 16px 0;">Schedules</h4>
          <div id="schedules-list"></div>
        </div>
      </div>

      <!-- Alert Rules Tab -->
      <div id="tab-alerts" class="tab-content" style="display:none;">
        <div class="card" style="padding:20px;margin-bottom:24px;">
          <h4 style="font-size:14px;font-weight:700;color:var(--text-primary);margin:0 0 16px 0;">Create Alert Rule</h4>
          <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Name</label>
              <input type="text" id="alert-name" class="input" placeholder="Revenue Alert" style="width:160px;padding:8px 12px;font-size:13px;">
            </div>
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Metric</label>
              <select id="alert-metric" class="input" style="width:150px;padding:8px 12px;font-size:13px;">
                <option value="revenue_drop">Revenue Drop</option>
                <option value="profit_drop">Profit Drop</option>
                <option value="missing_data">Missing Data</option>
                <option value="duplicate_spike">Duplicate Spike</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Condition</label>
              <select id="alert-condition" class="input" style="width:120px;padding:8px 12px;font-size:13px;">
                <option value="above">Above</option>
                <option value="below">Below</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Threshold (%)</label>
              <input type="number" id="alert-threshold" class="input" value="10" step="0.1" style="width:100px;padding:8px 12px;font-size:13px;">
            </div>
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">Email</label>
              <input type="email" id="alert-email" class="input" placeholder="user@example.com" style="width:180px;padding:8px 12px;font-size:13px;">
            </div>
            <button class="btn btn-primary" onclick="createAlert()" style="padding:8px 24px;">Create</button>
          </div>
          <div id="alert-result" style="margin-top:12px;"></div>
        </div>

        <div class="card" style="padding:20px;">
          <h4 style="font-size:14px;font-weight:700;color:var(--text-primary);margin:0 0 16px 0;">Alert Rules</h4>
          <div id="alerts-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/scheduled_reports.js"></script>
<script>
initSidebar('scheduled-reports');
document.addEventListener('DOMContentLoaded', () => {
  const sid = Session.require(); if (!sid) return;
  loadSchedules();
  loadAlerts();
});
</script>
</body>
</html>
