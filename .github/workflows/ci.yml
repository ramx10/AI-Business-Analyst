name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            python -m pytest tests/ -v
          else
            echo "No tests directory found — skipping test run"
          fi

      - name: Lint with ruff
        run: |
          if pip show ruff &>/dev/null; then
            ruff check .
          else
            echo "ruff not installed — skipping lint"
          fi

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Streamlit image
        run: docker build -t ai-analyst-streamlit .

      - name: Build Java backend image
        run: docker build -t ai-analyst-backend ./backend-java
