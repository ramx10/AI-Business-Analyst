<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard — AI Business Analyst</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const savedTheme = localStorage.getItem('ai_ba_theme') || 'light-corporate';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    .viz-selector {
      display: flex; flex-direction: column; gap: 2px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px 12px 12px 12px;
      min-width: 200px;
    }
    .viz-selector-title {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-secondary);
      padding: 0 8px 8px 8px; margin-bottom: 4px;
    }
    .viz-option {
      display: block;
      padding: 9px 12px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; transition: all 0.15s ease; border: none;
      background: transparent; text-align: left; width: 100%;
    }
    .viz-option:hover { background: var(--bg-hover); color: var(--text-primary); }
    .viz-option.active {
      background: var(--accent-muted); color: var(--accent);
      font-weight: 600;
    }
    .viz-option .viz-icon {
      width: 22px; height: 22px; display: flex; align-items: center;
      justify-content: center; font-size: 15px; flex-shrink: 0;
    }

    .chart-area {
      flex: 1; min-width: 0;
    }

    .viz-layout {
      display: flex; gap: 16px; align-items: stretch;
    }

    @media (max-width: 768px) {
      .viz-layout { flex-direction: column; }
      .viz-selector { flex-direction: row; overflow-x: auto; min-width: 0; }
      .viz-option { white-space: nowrap; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-crumb">
        <span>AI Business Analyst</span><span class="topbar-sep">/</span>
        <span class="current">Executive Dashboard</span>
      </div>
      <div class="topbar-actions" id="session-badge"></div>
    </header>
    <div class="page-content">
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div>
          <h1 class="page-title">Executive Dashboard</h1>
          <p class="page-subtitle">Step 5 of 7 — KPIs, trends, and breakdowns.</p>
        </div>
      </div>

      <!-- Control Panel for Themes & Templates -->
      <div class="control-panel" style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;">
        <div style="display:flex;gap:20px;align-items:center;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-secondary);">Template:</span>
            <select id="template-select" class="input" style="width:170px;padding:5px 10px;font-size:12px;cursor:pointer;">
              <option value="exec">Executive Overview</option>
              <option value="sales">Sales & Operations</option>
              <option value="product">Product Performance</option>
              <option value="superieur-admin">Superieur Admin</option>
              <option value="study-admin">Study Admin</option>
              <option value="server-admin">Server Admin</option>
            </select>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-secondary);">Theme:</span>
            <select id="theme-select" class="input" style="width:160px;padding:5px 10px;font-size:12px;cursor:pointer;">
              <option value="dark">Sleek Dark</option>
              <option value="light-corporate">Light Corporate</option>
              <option value="pastel-soft">Pastel Soft</option>
              <option value="material-admin">Material Admin</option>
              <option value="crypto-admin">Crypto Admin</option>
              <option value="medi-admin">Medi Admin</option>
              <option value="minimal-pro">Minimal Pro</option>
              <option value="soft-material">Soft Material</option>
              <option value="aone-admin">Aone Admin</option>
              <option value="alfa-admin">Alfa Admin</option>
              <option value="rubyx-admin">Rubyx Admin</option>
              <option value="pixel-admin">Pixel Admin</option>
              <option value="powerbi-admin">Power BI Admin</option>
              <option value="crmi-admin">CRMi Admin</option>
              <option value="gilded-admin">Gilded Admin</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:8px;">
          <a href="/insights.html" class="btn btn-primary btn-sm">AI Insights →</a>
          <button id="btn-export-pdf" class="btn btn-secondary btn-sm" style="font-size:11px;">⊡ Export PDF</button>
          <div style="display:flex;align-items:center;gap:6px;">
            <select id="export-format-quick" class="input" style="width:130px;padding:4px 8px;font-size:11px;cursor:pointer;">
              <option value="csv">CSV</option>
              <option value="excel">Excel</option>
              <option value="parquet">Parquet</option>
              <option value="json">JSON</option>
            </select>
            <button id="btn-export-dataset" class="btn btn-secondary btn-sm" style="font-size:11px;">↓ Export Data</button>
          </div>
        </div>
      </div>

      <div id="dash-root"><div class="loading-state"><div class="spinner"></div><span>Building dashboard…</span></div></div>
      
      <div style="margin-top:24px;display:flex;gap:8px;">
        <a href="/visualize.html" class="btn btn-ghost btn-sm">← Back to Visualize</a>
        <a href="/insights.html" class="btn btn-primary btn-sm">Continue to Insights →</a>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/exports.js"></script>
<script>
initSidebar('dashboard');

document.addEventListener('DOMContentLoaded', async () => {
  const root = document.getElementById('dash-root');
  const sid = Session.require(); if (!sid) return;

  const tempSelect = document.getElementById('template-select');
  const themeSelect = document.getElementById('theme-select');

  const savedTemplate = localStorage.getItem('ai_ba_template') || 'exec';
  let savedTheme = localStorage.getItem('ai_ba_theme') || 'dark';

  if (savedTemplate !== 'superieur-admin' && savedTemplate !== 'study-admin' && savedTemplate !== 'server-admin') {
    if (savedTheme === 'superieur-admin' || savedTheme === 'study-admin' || savedTheme === 'server-admin') {
      savedTheme = localStorage.getItem('ai_ba_regular_theme') || 'dark';
    }
    localStorage.setItem('ai_ba_regular_theme', savedTheme);
  }

  if (tempSelect) tempSelect.value = savedTemplate;

  let dashData = null;

  // ─── Column Detection ───────────────────────────────────────
  function buildColumnStatus(cols) {
    if (!cols) return '';
    const EXPECTED = [
      { key: 'revenue', label: 'Revenue / Sales', icon: '✦' },
      { key: 'profit',  label: 'Profit / Margin', icon: '↑' },
      { key: 'date',    label: 'Date / Time',     icon: '◈' },
      { key: 'region',  label: 'Region / Country', icon: '✦' },
      { key: 'category',label: 'Category / Type',  icon: '≡' },
      { key: 'product', label: 'Product / Item',   icon: '⧉' },
    ];
    return EXPECTED.map(e => {
      const found = cols[e.key];
      const status = found ? 'found' : 'missing';
      return `<span class="chip chip-${status}" style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;${found ? 'background:var(--green-muted);color:var(--green);' : 'background:var(--red-muted);color:var(--red);'}">
        ${e.icon} ${e.label}: ${found ? `<strong>${found}</strong>` : '<em>not found</em>'}
      </span>`;
    }).join('');
  }

  function render(templateId) {
    if (!dashData) return;
    const k = dashData.kpis, c = dashData.charts;

    let activeTheme = localStorage.getItem('ai_ba_theme') || 'dark';

    if (templateId === 'superieur-admin' || templateId === 'study-admin' || templateId === 'server-admin') {
      activeTheme = templateId;
      if (themeSelect) {
        themeSelect.value = '';
        themeSelect.disabled = true;
      }
    } else {
      if (themeSelect) {
        themeSelect.disabled = false;
        let currentTheme = localStorage.getItem('ai_ba_theme') || 'dark';
        if (currentTheme === 'superieur-admin' || currentTheme === 'study-admin' || currentTheme === 'server-admin') {
          activeTheme = localStorage.getItem('ai_ba_regular_theme') || 'dark';
        } else {
          activeTheme = currentTheme;
        }
        themeSelect.value = activeTheme;
      }
    }

    document.documentElement.setAttribute('data-theme', activeTheme);
    localStorage.setItem('ai_ba_theme', activeTheme);

    const sidebar = document.querySelector('.sidebar');
    if (sidebar && typeof buildSidebar === 'function') {
      sidebar.innerHTML = buildSidebar('dashboard');
    }

    // ─── Superieur Admin Custom Layout ─────────────────────────
    if (templateId === 'superieur-admin') {
      const trendLabels = c.revenue_trend && c.revenue_trend.labels.length > 0 ? c.revenue_trend.labels.slice(-7) : [];
      const val1 = c.revenue_trend && c.revenue_trend.values.length > 0 ? c.revenue_trend.values.slice(-7) : [];
      const hasTrend = trendLabels.length > 0 && val1.length > 0;
      const val2 = hasTrend ? val1.map(v => Math.round(v * 0.75)) : [];
      const val3 = hasTrend ? val1.map(v => Math.round(v * 0.5)) : [];

      let goalHtml = '';
      if (c.category && c.category.labels.length > 0) {
        const maxVal = c.category.values[0] || 1;
        goalHtml = c.category.labels.slice(0, 4).map((lbl, idx) => {
          const val = c.category.values[idx];
          const pct = Math.min(100, Math.round((val / maxVal) * 100));
          const color = ['#1e59ff', '#10b981', '#0ea5e9', '#f59e0b'][idx % 4];
          return `
            <div>
              <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span>${lbl}</span><strong>${val.toLocaleString()}</strong></div>
              <div style="width:100%;height:6px;background:var(--border-hover);border-radius:3px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${color};border-radius:3px;"></div></div>
            </div>`;
        }).join('');
      } else {
        goalHtml = `
          <div>
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span>Target Metric</span><strong>0</strong></div>
            <div style="width:100%;height:6px;background:var(--border-hover);border-radius:3px;overflow:hidden;"><div style="width:0%;height:100%;background:#1e59ff;border-radius:3px;"></div></div>
          </div>`;
      }

      const sparkValuesBlue = c.revenue_trend && c.revenue_trend.values.length >= 6 ? c.revenue_trend.values.slice(-12) : [];
      const sparkValuesRed = sparkValuesBlue.length ? sparkValuesBlue.map(v => Math.round(v * 0.8)) : [];

      let prodListHtml = '';
      if (c.products && c.products.labels.length > 0) {
        prodListHtml = c.products.labels.slice(0, 4).map((lbl, idx) => {
          const val = c.products.values[idx];
          const badge = ['Top seller', 'High margin', 'Hot item', 'Trending'][idx % 4];
          const color = ['#1e59ff', '#10b981', '#f43f5e', '#f59e0b'][idx % 4];
          const emoji = ['◉', '▣', '▣', '◉'][idx % 4];
          return `
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:32px;height:32px;background:var(--bg-hover);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;">${emoji}</div>
                <div><div style="font-size:11px;font-weight:600;color:var(--text-primary);">${lbl}</div><div style="font-size:9px;color:var(--text-secondary);">${val.toLocaleString()} units sold</div></div>
              </div>
              <span style="font-size:9px;font-weight:600;background:${color}15;color:${color};padding:2px 6px;border-radius:4px;">${badge}</span>
            </div>`;
        }).join('');
      } else {
        prodListHtml = '<div style="font-size:11px;color:var(--text-secondary);">No product data found.</div>';
      }

      root.innerHTML = `
        <div style="display:grid;gap:20px;">
          <!-- Row 1: Weekly Status + Stacked Cards -->
          <div style="display:grid;grid-template-columns:2.2fr 1fr;gap:20px;">
            <!-- Weekly Status -->
            <div class="card" style="padding:20px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h4 style="font-size:14px;font-weight:700;color:var(--text-primary);margin:0;">Weekly Status</h4>
                <span style="font-size:11px;color:var(--text-secondary);">Sales Report</span>
              </div>
              <div style="display:grid;grid-template-columns:2fr 1.1fr;gap:20px;align-items:center;">
              <div style="height:220px;"><canvas id="chart-weekly"></canvas><button class="btn-download-chart btn btn-ghost btn-sm" data-chart="chart-weekly" style="font-size:9px;padding:1px 6px;margin-top:4px;">⬇ PNG</button></div>
              <div style="display:flex;flex-direction:column;gap:12px;">
                  <div style="font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;margin-bottom:4px;">Goal Completion</div>
                  ${goalHtml}
                </div>
              </div>
              <!-- Bottom summary -->
              <div style="display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);margin-top:20px;padding-top:16px;gap:12px;text-align:center;">
                <div>
                  <div style="font-size:10px;color:var(--text-secondary);text-transform:uppercase;font-weight:500;">Total Revenue</div>
                  <div style="font-size:16px;font-weight:700;color:var(--text-primary);margin:2px 0;">${k.revenue ? k.revenue.value : '$0'}</div>
                  <div style="font-size:10px;color:var(--green);font-weight:600;">↑ ${k.revenue ? k.revenue.trend : '0%'}</div>
                </div>
                <div>
                  <div style="font-size:10px;color:var(--text-secondary);text-transform:uppercase;font-weight:500;">Net Profit</div>
                  <div style="font-size:16px;font-weight:700;color:var(--text-primary);margin:2px 0;">${k.profit ? k.profit.value : '$0'}</div>
                  <div style="font-size:10px;color:var(--green);font-weight:600;">↑ ${k.profit ? k.profit.trend : '0%'}</div>
                </div>
                <div>
                  <div style="font-size:10px;color:var(--text-secondary);text-transform:uppercase;font-weight:500;">Total Orders</div>
                  <div style="font-size:16px;font-weight:700;color:var(--text-primary);margin:2px 0;">${k.orders ? k.orders.value : '0'}</div>
                  <div style="font-size:10px;color:var(--green);font-weight:600;">↑ ${k.orders ? k.orders.trend : '0%'}</div>
                </div>
                <div>
                  <div style="font-size:10px;color:var(--text-secondary);text-transform:uppercase;font-weight:500;">Total Customers</div>
                  <div style="font-size:16px;font-weight:700;color:var(--text-primary);margin:2px 0;">${k.customers ? k.customers.value : '0'}</div>
                  <div style="font-size:10px;color:var(--green);font-weight:600;">↑ ${k.customers ? k.customers.trend : '0%'}</div>
                </div>
              </div>
            </div>
            <!-- Right Column: Blue + Red Widget Cards -->
            <div style="display:flex;flex-direction:column;gap:20px;">
              <div style="background:#1e59ff;color:#fff;padding:20px;border-radius:var(--radius);display:flex;flex-direction:column;justify-content:space-between;flex:1;box-shadow:0 4px 20px rgba(30,89,255,0.15);">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                  <div>
                    <div style="font-size:11px;opacity:0.8;text-transform:uppercase;font-weight:600;letter-spacing:0.5px;">Sales Volume</div>
                    <div style="font-size:20px;font-weight:700;margin-top:4px;">${k.revenue ? k.revenue.value : '0'}</div>
                  </div>
                  <span style="font-size:10px;background:rgba(255,255,255,0.15);padding:2px 6px;border-radius:10px;">↑ ${k.revenue ? k.revenue.trend : '0%'}</span>
                </div>
                <div style="height:55px;margin-top:10px;"><canvas id="chart-superieur-blue"></canvas></div>
              </div>
              <div style="background:#f43f5e;color:#fff;padding:20px;border-radius:var(--radius);display:flex;flex-direction:column;justify-content:space-between;flex:1;box-shadow:0 4px 20px rgba(244,63,94,0.15);">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                  <div>
                    <div style="font-size:11px;opacity:0.8;text-transform:uppercase;font-weight:600;letter-spacing:0.5px;">Active Profit</div>
                    <div style="font-size:20px;font-weight:700;margin-top:4px;">${k.profit ? k.profit.value : '0'}</div>
                  </div>
                  <span style="font-size:10px;background:rgba(255,255,255,0.15);padding:2px 6px;border-radius:10px;">↑ ${k.profit ? k.profit.trend : '0%'}</span>
                </div>
                <div style="height:55px;margin-top:10px;"><canvas id="chart-superieur-red"></canvas></div>
              </div>
            </div>
          </div>
          <!-- Row 2: Earnings + Top Products + Visitors -->
          <div style="display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:20px;">
            <!-- Earnings -->
            <div class="card" style="padding:20px;display:flex;flex-direction:column;justify-content:space-between;">
              <div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                  <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin:0;">Earnings</h4>
                  <span style="font-size:10px;color:var(--text-secondary);">Monthly Total</span>
                </div>
                <div style="font-size:24px;font-weight:700;color:var(--text-primary);">${k.profit ? k.profit.value : '$0'}</div>
                <div style="font-size:11px;color:var(--green);font-weight:600;margin-top:2px;">↑ ${k.profit ? k.profit.trend : '0%'} vs last period</div>
              </div>
              <div style="height:100px;margin-top:15px;"><canvas id="chart-superieur-earnings"></canvas></div>
            </div>
            <!-- Recently Top Products -->
            <div class="card" style="padding:20px;display:flex;flex-direction:column;">
              <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin:0 0 14px 0;">Recently Top Products</h4>
              <div style="display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center;">
                ${prodListHtml}
              </div>
            </div>
            <!-- Visitors Map -->
            <div class="card" style="padding:20px;display:flex;flex-direction:column;">
              <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin:0 0 8px 0;">Visitors Map</h4>
              <div style="flex:1;display:flex;align-items:center;justify-content:center;position:relative;">
                <svg viewBox="0 0 1000 480" style="width:100%;height:auto;">
                  <style>@keyframes mapPulse{0%,100%{r:14;opacity:0.25}50%{r:20;opacity:0.1}}</style>
                  <path d="M150,60 L280,55 L300,100 L280,140 L250,170 L210,180 L180,200 L150,180 L130,140 L120,100 Z" fill="var(--text-tertiary)" opacity="0.25"/>
                  <path d="M190,220 L240,210 L260,230 L280,310 L260,370 L230,390 L210,340 L200,280 Z" fill="var(--text-tertiary)" opacity="0.25"/>
                  <path d="M420,60 L580,50 L620,70 L600,180 L500,200 L440,150 Z" fill="var(--text-tertiary)" opacity="0.25"/>
                  <path d="M580,50 L850,60 L900,200 L780,260 L680,230 L620,170 L620,70 Z" fill="var(--text-tertiary)" opacity="0.25"/>
                  <path d="M480,220 L580,210 L620,250 L600,340 L560,360 L510,330 L480,270 Z" fill="var(--text-tertiary)" opacity="0.25"/>
                  <path d="M760,300 L880,310 L870,400 L790,420 L750,380 Z" fill="var(--text-tertiary)" opacity="0.25"/>
                  <circle cx="210" cy="120" r="5" fill="#10b981"/><circle cx="210" cy="120" r="14" fill="#10b981" opacity="0.25" style="animation:mapPulse 2s infinite;"/>
                  <circle cx="240" cy="300" r="4" fill="#1e59ff"/><circle cx="240" cy="300" r="12" fill="#1e59ff" opacity="0.25"/>
                  <circle cx="500" cy="130" r="6" fill="#10b981"/><circle cx="500" cy="130" r="16" fill="#10b981" opacity="0.25" style="animation:mapPulse 2s 0.5s infinite;"/>
                  <circle cx="780" cy="170" r="7" fill="#f43f5e"/><circle cx="780" cy="170" r="18" fill="#f43f5e" opacity="0.25" style="animation:mapPulse 2s 1s infinite;"/>
                  <circle cx="830" cy="350" r="5" fill="#f59e0b"/><circle cx="830" cy="350" r="14" fill="#f59e0b" opacity="0.25"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      `;
      if (hasTrend) {
        makeGroupedBarChart('chart-weekly', trendLabels, val1, val2, val3);
        makeSuperieurSparkline('chart-superieur-earnings', val1, '#1e59ff', 'bar');
      }
      if (sparkValuesBlue.length) {
        makeSuperieurSparkline('chart-superieur-blue', sparkValuesBlue, '#ffffff', 'bar');
        makeSuperieurSparkline('chart-superieur-red', sparkValuesRed, '#ffffff', 'line');
      }
      return;
    }

    if (templateId === 'study-admin') {
      let activityHtml = '';
      if (c.category && c.category.labels.length > 0) {
        activityHtml = c.category.labels.slice(0, 3).map((lbl, idx) => {
          const val = c.category.values[idx];
          const time = ['10:00', '14:30', '12:00'][idx % 3];
          const day = ['Today', 'Tomorrow', 'Friday'][idx % 3];
          const color = ['#f97316', '#2563eb', '#ef4444'][idx % 3];
          const type = ['Mentoring', 'Online Course', 'Workshop'][idx % 3];
          return `
            <div style="display:flex;gap:12px;align-items:flex-start;">
              <div style="display:flex;flex-direction:column;align-items:center;min-width:60px;">
                <span style="font-size:10px;font-weight:700;color:${color};text-transform:uppercase;">${day}</span>
                <span style="font-size:12px;color:var(--text-secondary);">${time}</span>
              </div>
              <div style="background:var(--bg-hover);padding:10px 14px;border-radius:var(--radius);flex:1;display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <div style="font-size:12px;font-weight:600;color:var(--text-primary);">${lbl}</div>

        list.push(`✦ <strong>Category Dominance</strong>: Category <strong>${chartData.category.labels[0]}</strong> holds the primary position.`);
      }
      if (chartData.regional && chartData.regional.labels.length > 0) {
        list.push(`✦ <strong>Geographic Focus</strong>: <strong>${chartData.regional.labels[0]}</strong> region stands out as the primary location.`);
      }
      if (chartData.revenue_trend && chartData.revenue_trend.labels.length > 0) {
        list.push(`◈ <strong>Seasonality Peak</strong>: Performance peaks indicate cyclical demand that requires planned preparation.`);
      }
      if (list.length === 0) {
        list.push("✦ Dataset processed successfully. No clear high-level trends detected.");
      }
      return list;
    }

    const insights = getHeuristicInsights(k, c);

    if (templateId === 'exec') {
      const hasTrend = c.revenue_trend && c.revenue_trend.labels.length > 0 && c.revenue_trend.values.length > 0;
      const hasCategory = c.category && c.category.labels.length > 0;
      const hasProducts = c.products && c.products.labels.length > 0;
      const hasRegion = c.regional && c.regional.labels.length > 0;
      const momGrowth = k.revenue && k.revenue.trend ? k.revenue.trend : '+0%';
      const profitMarginVal = k.profit_margin ? parseFloat(k.profit_margin.value) || 0 : 0;

      chartsHtml = `
        <!-- KPI Grid -->
        <div class="kpi-grid" style="grid-template-columns: repeat(5, 1fr); margin-bottom: 20px;">
          ${buildKpis(['revenue', 'profit', 'orders', 'customers', 'profit_margin'], k)}
        </div>

        <!-- Main Trend + Gauge Row -->
        <div style="display:grid;grid-template-columns: 2.2fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div class="card" style="padding:20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h4 style="font-size:14px;font-weight:700;color:var(--text-primary);margin:0;">Primary Performance Trend</h4>
              <button class="btn-download-chart btn btn-ghost btn-sm" data-chart="chart-main-trend" style="font-size:10px;padding:2px 8px;">⬇ PNG</button>
            </div>
            ${hasTrend ? '<div style="height:220px;"><canvas id="chart-main-trend"></canvas></div>' : '<div style="height:220px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:13px;">No time-series data found. Dataset needs a <strong>date</strong> or <strong>time</strong> column.</div>'}
          </div>
          <div class="card" style="padding:20px;display:flex;flex-direction:column;justify-content:space-between;">
            <h4 style="font-size:14px;font-weight:700;color:var(--text-primary);margin:0 0 10px 0;">Target Progress</h4>
            <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;">
              <div style="font-size:36px;font-weight:700;color:var(--accent);">${k.profit_margin ? k.profit_margin.value : 'N/A'}</div>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">Performance Index</div>
              ${profitMarginVal > 0 ? `
              <div style="width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:16px;">
                <div style="width:${Math.min(100, profitMarginVal)}%;height:100%;background:var(--accent);border-radius:4px;"></div>
              </div>` : ''}
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:12px;">
              <span style="color:var(--text-secondary);">Growth: MoM</span>
              <strong style="color:var(--green);">${momGrowth}</strong>
            </div>
          </div>
        </div>

        <!-- Secondary Charts Grid -->
        <div class="grid-2" style="margin-bottom: 20px;">
          <div class="card" style="padding:20px;">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;"><div class="card-title">Category Share</div></div>
            ${hasCategory
              ? `<div class="card-body" style="padding-top:0"><div style="height:240px"><canvas id="chart-cat"></canvas></div></div>`
              : '<div class="card-body" style="padding-top:0;height:240px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:13px;">No category column detected. Try naming one <strong>category</strong>, <strong>type</strong>, or <strong>group</strong>.</div>'}
          </div>
          <div class="card" style="padding:20px;">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;"><div class="card-title">Top Products</div></div>
            ${hasProducts
              ? `<div class="card-body" style="padding-top:0"><div style="height:240px"><canvas id="chart-prod"></canvas></div></div>`
              : '<div class="card-body" style="padding-top:0;height:240px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:13px;">No product column found. Try naming one <strong>product</strong>, <strong>item</strong>, or <strong>title</strong>.</div>'}
          </div>
        </div>

        <!-- AI Insights & Recommendations -->
        <div class="grid-2">
          <div class="card" style="padding:20px;">
            <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:12px;">Auto AI Insights Panel</h4>
            <div style="display:flex;flex-direction:column;gap:10px;">
              ${insights.length > 0 ? insights.map(ins => `<div style="background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:12px;">${ins}</div>`).join('') : '<div style="color:var(--text-tertiary);font-size:12px;padding:12px;">No insights generated — upload a dataset with recognized columns.</div>'}
            </div>
          </div>
          <div class="card" style="padding:20px;">
            <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:12px;">Tactical Recommendations</h4>
            <ul style="padding-left:16px;font-size:12px;color:var(--text-secondary);line-height:1.6;display:flex;flex-direction:column;gap:6px;">
              ${hasTrend ? '<li><strong>Inventory/Capacity Allocation</strong>: Match supply chain capabilities to peak months detected by trends.</li>' : ''}
              ${hasRegion ? '<li><strong>Focused Marketing</strong>: Redirect marketing budget to support primary geographic zones.</li>' : ''}
              ${hasCategory ? '<li><strong>Cross-Selling Opportunities</strong>: Introduce special bundles linking underperforming segments to primary categories.</li>' : ''}
              ${(!hasTrend && !hasRegion && !hasCategory) ? '<li style="color:var(--text-tertiary);">No actionable trends detected. Check column naming above.</li>' : ''}
            </ul>
          </div>
        </div>
      `;
    } else if (templateId === 'sales') {
      chartsHtml = `
        <!-- Top bar search & status -->
        <div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;margin-bottom:20px;gap:16px;">
          <input type="text" id="pbi-search" placeholder="◉ Search Category / Product..." class="input" style="max-width:300px;font-size:12px;padding:6px 12px;margin:0;" />
          <div style="font-size:11px;color:var(--text-secondary);">Filtered Status: <strong style="color:var(--accent);">${c.revenue_trend.values.length} Monthly points</strong></div>
        </div>

        <!-- Cumulative volume trend -->
        <div class="card" style="padding:20px;margin-bottom:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h4 style="font-size:14px;font-weight:700;color:var(--text-primary);margin:0;">Overall Cumulative Volume Trend</h4>
            <button class="btn-download-chart btn btn-ghost btn-sm" data-chart="chart-cumulative-trend" style="font-size:10px;padding:2px 8px;">⬇ PNG</button>
          </div>
          <div style="height:220px;"><canvas id="chart-cumulative-trend"></canvas></div>
        </div>

        <!-- 4 KPI Cards -->
        <div class="kpi-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 20px;">
          ${buildKpis(['revenue', 'orders', 'customers', 'profit_margin'], k)}
        </div>

        <!-- Sales breakdown + AI insights -->
        <div class="grid-2">
          <div class="card" style="padding:20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin:0;">Sales Overview Breakdown</h4>
              <button class="btn-download-chart btn btn-ghost btn-sm" data-chart="chart-sales-breakdown" style="font-size:10px;padding:2px 8px;">⬇ PNG</button>
            </div>
            <div style="height:240px;"><canvas id="chart-sales-breakdown"></canvas></div>
          </div>
          <div class="card" style="padding:20px;">
            <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:12px;">Power BI AI Insights</h4>
            <div style="display:flex;flex-direction:column;gap:10px;">
              ${insights.slice(0, 3).map(ins => `<div style="background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:12px;">${ins}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
    } else if (templateId === 'product') {
      chartsHtml = `
        <!-- Top row 4 cards -->
        <div class="kpi-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 20px;">
          <div class="kpi-card">
            <div class="kpi-label">Study / Activity Hours</div>
            <div class="kpi-value">${k.revenue ? k.revenue.value : '0'}</div>
            <div class="kpi-trend up">↑ 1.4hr <span>vs target</span></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Lessons Completed</div>
            <div class="kpi-value">${k.orders ? k.orders.value : '0'}</div>
            <div class="kpi-trend up">↑ 3 units <span>completed</span></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Mentoring Sessions</div>
            <div class="kpi-value">${k.customers ? k.customers.value : '0'}</div>
            <div class="kpi-trend up">↑ This month</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Completion Index</div>
            <div class="kpi-value">86%</div>
            <div class="kpi-trend up">↑ 5% <span>vs target</span></div>
          </div>
        </div>

        <!-- Middle Section -->
        <div style="display:grid;grid-template-columns: 1fr 2fr 1fr; gap: 20px; margin-bottom: 20px;">
          <!-- Left: Daily activity schedule panel -->
          <div class="card" style="padding:20px;display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:12px;">Daily Activity Panel</h4>
              <div style="display:flex;flex-direction:column;gap:10px;font-size:11px;color:var(--text-secondary);">
                <div>• <strong>English - Grammar</strong> <span style="color:var(--green)">8:00 AM (1h 15m)</span></div>
                <div>• <strong>Beginner Math Test</strong> <span style="color:var(--green)">10:30 AM (2h 30m)</span></div>
                <div>• <strong>Marketing Basics</strong> <span>Tomorrow (1h 00m)</span></div>
                <div>• <strong>Group Project Sync</strong> <span>Friday (45m)</span></div>
              </div>
            </div>
            <button class="btn btn-primary btn-sm" style="width:100%;margin-top:16px;justify-content:center;">Invite Friends</button>
          </div>

          <!-- Middle: statistics line chart -->
          <div class="card" style="padding:20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin:0;">Learning Statistics</h4>
              <button class="btn-download-chart btn btn-ghost btn-sm" data-chart="chart-learning-stats" style="font-size:10px;padding:2px 8px;">⬇ PNG</button>
            </div>
            <div style="height:200px;"><canvas id="chart-learning-stats"></canvas></div>
          </div>

          <!-- Right: category counts progress bars -->
          <div class="card" style="padding:20px;">
            <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:12px;">Subject Categories</h4>
            <div id="edu-categories" style="display:flex;flex-direction:column;gap:12px;"></div>
          </div>
        </div>

        <!-- Bottom row -->
        <div class="grid-2">
          <div class="card" style="padding:20px;display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:8px;">Downloads & Logs</h4>
              <p style="font-size:11px;color:var(--text-secondary);margin-bottom:12px;">Export learning summaries, progress indexes, and study log files.</p>
            </div>
            <button class="btn btn-secondary btn-sm" id="btn-download-logs" style="justify-content:center;">Download Study Log CSV</button>
          </div>
          <div class="card" style="padding:20px;">
            <h4 style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:12px;">Productivity Insights</h4>
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${insights.map(ins => `<div style="background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:11px;">${ins}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    root.innerHTML = chartsHtml;

    // Draw charts based on template ID
    function safeChartData(chartKey, field) {
      const d = c[chartKey];
      return d && d[field] && d[field].length > 0 ? d[field] : [];
    }

    if (templateId === 'exec') {
      const trendLabels = safeChartData('revenue_trend', 'labels');
      const trendValues = safeChartData('revenue_trend', 'values');
      const catLabels = safeChartData('category', 'labels');
      const catValues = safeChartData('category', 'values');
      const prodLabels = safeChartData('products', 'labels');
      const prodValues = safeChartData('products', 'values');
      if (trendLabels.length && trendValues.length) {
        makeLineChart('chart-main-trend', trendLabels, trendValues);
      }
      if (catLabels.length && catValues.length) {
        makeDoughnutChart('chart-cat', catLabels, catValues);
      }
      if (prodLabels.length && prodValues.length) {
        makeBarChart('chart-prod', prodLabels, prodValues, true);
      }
    } else if (templateId === 'sales') {
      const trendLabels = safeChartData('revenue_trend', 'labels');
      const trendValues = safeChartData('revenue_trend', 'values');
      if (trendLabels.length && trendValues.length) {
        makeLineChart('chart-cumulative-trend', trendLabels, trendValues);
      }
      const catLabels = safeChartData('category', 'labels');
      const catValues = safeChartData('category', 'values');
      if (catLabels.length && catValues.length) {
        makeBarChart('chart-sales-breakdown', catLabels, catValues);
      }
      // Add live search listener
      const pbiSearch = document.getElementById('pbi-search');
      if (pbiSearch) {
        pbiSearch.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          const filteredLabels = [];
          const filteredValues = [];
          catLabels.forEach((lbl, idx) => {
            if (lbl.toLowerCase().includes(query)) {
              filteredLabels.push(lbl);
              filteredValues.push(catValues[idx]);
            }
          });
          if (filteredLabels.length) makeBarChart('chart-sales-breakdown', filteredLabels, filteredValues);
        });
      }
    } else if (templateId === 'product') {
      const trendLabels = safeChartData('revenue_trend', 'labels');
      const trendValues = safeChartData('revenue_trend', 'values');
      if (trendLabels.length && trendValues.length) {
        makeLineChart('chart-learning-stats', trendLabels, trendValues);
      }
      // Populate subject categories list with progress bars
      const eduCatContainer = document.getElementById('edu-categories');
      if (eduCatContainer && c.category && c.category.labels.length > 0) {
        const maxVal = c.category.values[0] || 1;
        eduCatContainer.innerHTML = c.category.labels.slice(0, 4).map((lbl, idx) => {
          const val = c.category.values[idx];
          const percent = Math.min(100, Math.round((val / maxVal) * 100));
          return `
            <div>
              <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;">
                <span><strong>${lbl}</strong></span>
                <span>${val.toLocaleString()} logs</span>
              </div>
              <div style="width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;">
                <div style="width:${percent}%;height:100%;background:var(--accent);border-radius:3px;"></div>
              </div>
            </div>
          `;
        }).join('');
      }
      // Add download CSV handler
      const btnDownload = document.getElementById('btn-download-logs');
      if (btnDownload) {
        btnDownload.addEventListener('click', () => {
          if (!c.category || !c.category.labels.length) return;
          const csvContent = "data:text/csv;charset=utf-8,Category,Value\n" + c.category.labels.map((lbl, idx) => `"${lbl}",${c.category.values[idx]}`).join("\n");
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", "study_progress.csv");
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        });
      }
    }
  }

  function kpisCount(templateId) {
    if (templateId === 'exec') return 5;
    return 3;
  }

  function buildKpis(keys, kpiData) {
    const kpiDefs = {
      revenue: { label: 'Total Revenue' },
      profit: { label: 'Net Profit' },
      orders: { label: 'Total Orders' },
      customers: { label: 'Unique Customers' },
      profit_margin: { label: 'Profit Margin' }
    };
    return keys.map(key => {
      const kd = kpiData[key]; if (!kd) return '';
      const def = kpiDefs[key];
      const up = kd.direction === 'up';
      return `
        <div class="kpi-card">
          <div class="kpi-label">${def.label}</div>
          <div class="kpi-value">${kd.value}</div>
          <div class="kpi-trend ${up ? 'up' : 'down'}">${up ? '↑' : '↓'} ${kd.trend} <span>vs last period</span></div>
        </div>`;
    }).join('');
  }

  // Load data
  try {
    dashData = await API.get(`/api/dashboard?session_id=${sid}`);
    // Insert column detection status above dash-root
    const colStatus = document.createElement('div');
    colStatus.id = 'column-status';
    colStatus.style.cssText = 'margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px;';
    if (dashData.columns) {
      const allMissing = !dashData.columns.revenue && !dashData.columns.date && !dashData.columns.region;
      if (allMissing) {
        colStatus.innerHTML = `
          <div class="alert alert-warning" style="width:100%;margin:0;font-size:12px;display:flex;align-items:center;gap:8px;padding:10px 14px;">
            <span>⚠</span>
            <span>No common columns detected. Your dataset columns need to match expected names like <strong>revenue</strong>, <strong>date</strong>, <strong>region</strong>, <strong>category</strong>, or <strong>product</strong>.</span>
          </div>`;
      }
      colStatus.innerHTML += buildColumnStatus(dashData.columns);
    }
    root.parentNode.insertBefore(colStatus, root);
    render(savedTemplate);
  } catch (e) {
    root.innerHTML = `<div class="alert alert-danger">${e.message} — <a href="/upload.html" style="color:inherit">upload a dataset first</a></div>`;
    return;
  }

  // Template Change Handler
  if (tempSelect) {
    tempSelect.addEventListener('change', (e) => {
      const template = e.target.value;
      localStorage.setItem('ai_ba_template', template);
      render(template);
    });
  }

  // Theme Change Handler
  function updateTheme(theme) {
    if (theme !== 'superieur-admin' && theme !== 'study-admin' && theme !== 'server-admin') {
      localStorage.setItem('ai_ba_regular_theme', theme);
    }
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('ai_ba_theme', theme);
    if (themeSelect) themeSelect.value = theme;
    const activeTemplate = localStorage.getItem('ai_ba_template') || 'exec';
    render(activeTemplate);
  }

  if (themeSelect) {
    themeSelect.addEventListener('change', (e) => {
      updateTheme(e.target.value);
    });
  }

  window.addEventListener('theme-changed', (e) => {
    updateTheme(e.detail.theme);
  });

  // ─── Download Chart as PNG ─────────────────────────────────
  function downloadChartAsPNG(canvasId, filename) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = filename || (canvasId + '.png');
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-download-chart');
    if (btn) {
      const chartId = btn.getAttribute('data-chart');
      downloadChartAsPNG(chartId, chartId + '.png');
    }
  });

  // ─── Export Dashboard as PDF ────────────────────────────────
  document.getElementById('btn-export-pdf')?.addEventListener('click', async () => {
    const dashRoot = document.getElementById('dash-root');
    if (!dashRoot) return;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();

    // Capture each card section individually
    const cards = dashRoot.querySelectorAll('.card, [class*="card"]');
    let yOffset = 10;
    for (const card of cards) {
      try {
        const cardCanvas = await html2canvas(card, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
        const imgData = cardCanvas.toDataURL('image/png');
        const imgWidth = pageWidth - 20;
        const imgHeight = (cardCanvas.height * imgWidth) / cardCanvas.width;
        if (yOffset + imgHeight > pageHeight - 10) {
          pdf.addPage();
          yOffset = 10;
        }
        pdf.addImage(imgData, 'PNG', 10, yOffset, imgWidth, imgHeight);
        yOffset += imgHeight + 5;
      } catch (err) {
        console.warn('Could not capture card:', err);
      }
    }
    pdf.save('dashboard_export.pdf');
  });

  // ─── Quick Dataset Export ────────────────────────────────
  const quickExportBtn = document.getElementById('btn-export-dataset');
  const quickExportFmt = document.getElementById('export-format-quick');
  if (quickExportBtn && quickExportFmt) {
    quickExportBtn.addEventListener('click', async () => {
      const fmt = quickExportFmt.value;
      quickExportBtn.disabled = true;
      quickExportBtn.textContent = '⏳...';
      try {
        await ExportManager.downloadData(sid, fmt);
        Toast.show('Download started', 'success');
      } catch (e) {
        Toast.show(e.message, 'error');
      } finally {
        quickExportBtn.disabled = false;
        quickExportBtn.textContent = '↓ Export Data';
      }
    });
  }
});
</script>
</body>
</html>
