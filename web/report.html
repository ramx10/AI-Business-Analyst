<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AI Report — AI Business Analyst</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const savedTheme = localStorage.getItem('ai_ba_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const savedTemplate = localStorage.getItem('ai_ba_template') || '';
    if (savedTemplate === 'superieur-admin' || savedTemplate === 'study-admin' || savedTemplate === 'server-admin') {
      document.documentElement.classList.add('template-' + savedTemplate);
    }
  </script>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-crumb">
        <span>AI Business Analyst</span><span class="topbar-sep">/</span>
        <span class="current">AI Report</span>
      </div>
      <div class="topbar-actions" id="session-badge"></div>
    </header>
    <div class="page-content">
      <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <h1 class="page-title">Executive Report</h1>
          <p class="page-subtitle">Step 7 of 7 — Full multi-agent supervisor pipeline report.</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div class="btn-group" id="mode-toggle">
            <button class="btn btn-sm mode-btn active" data-mode="summary">Summary</button>
            <button class="btn btn-sm mode-btn" data-mode="detailed">Detailed</button>
          </div>
          <div class="btn-sep"></div>
          <button class="btn btn-primary" id="generate-btn">Generate Report</button>
          <div class="download-group" id="download-group" style="display:none">
            <button class="btn btn-secondary" id="download-btn">↓ Download</button>
            <div class="dropdown-menu" id="format-menu">
              <button class="dropdown-item" data-format="pdf">.pdf (PDF)</button>
              <button class="dropdown-item" data-format="md">.md (Markdown)</button>
              <button class="dropdown-item" data-format="html">.html (Web Page)</button>
              <button class="dropdown-item" data-format="txt">.txt (Plain Text)</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Pipeline status strip -->
      <div class="card no-hover" style="margin-bottom:20px;">
        <div class="card-body" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;">
          <span style="font-size:12px;color:var(--text-secondary)">Pipeline:</span>
          <span class="pill pill-muted">Schema Agent</span>
          <span style="color:var(--text-muted)">→</span>
          <span class="pill pill-muted">Cleaning Agent</span>
          <span style="color:var(--text-muted)">→</span>
          <span class="pill pill-muted">KPI Agent</span>
          <span style="color:var(--text-muted)">→</span>
          <span class="pill pill-muted">AI Insight Agent</span>
          <span style="color:var(--text-muted)">→</span>
          <span class="pill pill-muted">Report Agent</span>
          <span id="pipeline-status" style="margin-left:auto"></span>
        </div>
      </div>

      <div id="report-root">
        <div class="card no-hover">
          <div class="card-body" style="padding:48px;text-align:center;color:var(--text-secondary);">
            <div style="font-size:28px;margin-bottom:12px;opacity:0.4">⊡</div>
            <div style="font-size:13px">Click <strong style="color:var(--text-primary)">Generate Report</strong> to run the full supervisor pipeline.</div>
          </div>
        </div>
      </div>

      <div style="margin-top:20px;">
        <a href="/insights.html" class="btn btn-ghost btn-sm">← Back to Insights</a>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
initSidebar('report');
document.addEventListener('DOMContentLoaded', () => {
  const genBtn = document.getElementById('generate-btn');
  const dlBtn = document.getElementById('download-btn');
  const root = document.getElementById('report-root');
  const pipelineStatus = document.getElementById('pipeline-status');
  const modeToggle = document.getElementById('mode-toggle');
  const downloadGroup = document.getElementById('download-group');
  const formatMenu = document.getElementById('format-menu');
  const sid = Session.require(); if (!sid) return;
  let reportText = '';
  let currentMode = 'summary';

  /* ── Mode toggle ───────────────────────────────── */
  modeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn || btn.classList.contains('active')) return;
    modeToggle.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    if (reportText) {
      /* auto-regenerate when switching modes if a report already exists */
      genBtn.click();
    }
  });

  /* ── Pipeline pill animation ───────────────────── */
  const activatePills = () => {
    document.querySelectorAll('.pill-muted').forEach((p,i) => {
      setTimeout(() => {
        p.classList.remove('pill-muted');
        p.classList.add('pill-blue');
      }, i * 300);
    });
  };

  /* ── Generate / Regenerate ─────────────────────── */
  genBtn.addEventListener('click', async () => {
    genBtn.disabled = true; genBtn.textContent = 'Generating…';
    downloadGroup.style.display = 'none';
    activatePills();
    pipelineStatus.innerHTML = '<span class="pill pill-yellow">Running…</span>';
    root.innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Running supervisor pipeline — this may take 30–60 seconds…</span></div>';
    try {
      const d = await API.get(`/api/report?session_id=${sid}&mode=${currentMode}`);
      reportText = d.report;
      pipelineStatus.innerHTML = '<span class="pill pill-green">Complete</span>';
      const modeLabel = currentMode === 'summary' ? 'Summary' : 'Detailed';
      root.innerHTML = `
        <div class="card">
          <div class="card-header" style="border-top:2px solid var(--accent);">
            <div><div class="card-title">${modeLabel} Report</div>
            <div class="card-subtitle">Generated by the multi-agent supervisor pipeline</div></div>
            <span class="pill pill-green">Complete</span>
          </div>
          <div class="card-body prose">${marked.parse(reportText)}</div>
        </div>`;
      downloadGroup.style.display = 'inline-flex';
    } catch(e) {
      pipelineStatus.innerHTML = '<span class="pill pill-red">Failed</span>';
      root.innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
    } finally { genBtn.disabled = false; genBtn.textContent = 'Regenerate'; }
  });

  /* ── Format dropdown ────────────────────────────── */
  dlBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    formatMenu.classList.toggle('open');
  });
  document.addEventListener('click', () => formatMenu.classList.remove('open'));

  formatMenu.addEventListener('click', (e) => {
    const item = e.target.closest('.dropdown-item');
    if (!item) return;
    const fmt = item.dataset.format;
    downloadReport(fmt);
    formatMenu.classList.remove('open');
  });

  function downloadReport(format) {
    const modeLabel = currentMode === 'summary' ? 'summary' : 'detailed';
    let blob, filename;
    switch (format) {
      case 'pdf':
        dlBtn.disabled = true; dlBtn.textContent = 'Generating PDF…';
        fetch('/api/report/export/pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ report_text: reportText, mode: currentMode })
        })
        .then(r => { if (!r.ok) throw new Error('PDF export failed'); return r.blob(); })
        .then(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `${modeLabel}_report.pdf`;
          a.click();
        })
        .catch(e => alert(e.message))
        .finally(() => { dlBtn.disabled = false; dlBtn.textContent = '↓ Download'; });
        return;
      case 'html':
        const htmlContent = `<html><head><meta charset="utf-8"><style>
          body { font-family: 'Inter', system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #1a1a1a; }
          h1, h2, h3, h4 { color: #111; margin-top: 24px; }
          ul { padding-left: 20px; }
          li { margin-bottom: 6px; }
          strong { color: #000; }
        </style></head><body>${marked.parse(reportText)}</body></html>`;
        blob = new Blob([htmlContent], { type: 'text/html' });
        filename = `${modeLabel}_report.html`;
        break;
      case 'txt':
        const plain = reportText
          .replace(/\*\*(.*?)\*\*/g, '$1')
          .replace(/^### /gm, '')
          .replace(/#{1,3}\s/g, '')
          .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
        blob = new Blob([plain], { type: 'text/plain' });
        filename = `${modeLabel}_report.txt`;
        break;
      default:
        blob = new Blob([reportText], { type: 'text/markdown' });
        filename = `${modeLabel}_report.md`;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }
});
</script>
</body>
</html>
